<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="640" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Every Step Is Settled &amp; Verifiable</text>
  <text x="640" y="86" text-anchor="middle" font-size="17" fill="#64748b">模型只提议，世界裁决 —— 一次状态转移的完整链路</text>

  <!-- ===================== 6 nodes ===================== -->
  <!-- geometry -->
  <!-- x0..x5: 70, 264, 458, 652, 846, 1040 ; node w=170 h=174 ; arrows between -->

  <!-- Node 1: Observe -->
  <g filter="url(#shadow)">
    <rect x="70" y="130" width="170" height="174" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="155" cy="180" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <!-- eye icon -->
    <path d="M 143 180 a 12 7 0 1 0 24 0 a 12 7 0 1 0 -24 0" fill="none" stroke="#2563eb" stroke-width="2"/>
    <circle cx="155" cy="180" r="4.5" fill="#2563eb"/>
    <text x="155" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">观察</text>
    <text x="155" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">S_t</text>
    <text x="155" y="286" text-anchor="middle" font-size="11" fill="#64748b">读取正式</text>
    <text x="155" y="302" text-anchor="middle" font-size="11" fill="#64748b">世界状态</text>
  </g>

  <!-- Node 2: Propose -->
  <g filter="url(#shadow)">
    <rect x="264" y="130" width="170" height="174" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="349" cy="180" r="26" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <!-- paper-plane icon -->
    <path d="M 336 190 L 349 171 L 362 190 L 349 184 z" fill="#d97706"/>
    <path d="M 336 190 L 362 190" stroke="#d97706" stroke-width="2"/>
    <text x="349" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">提议</text>
    <text x="349" y="264" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d97706" font-family="Consolas, 'Courier New', monospace">ActionProposal</text>
    <text x="349" y="286" text-anchor="middle" font-size="11" fill="#64748b">策略 / LLM</text>
    <text x="349" y="302" text-anchor="middle" font-size="11" fill="#64748b">提交候选动作</text>
  </g>

  <!-- Node 3: Validate -->
  <g filter="url(#shadow)">
    <rect x="458" y="130" width="170" height="174" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="543" cy="180" r="26" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <!-- shield icon -->
    <path d="M 543 168 L 554 174 L 554 185 C 554 192 549 197 543 199 C 537 197 532 192 532 185 L 532 174 z" fill="none" stroke="#0d9488" stroke-width="2"/>
    <path d="M 538 183 L 542 187 L 549 179" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
    <text x="543" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">校验</text>
    <text x="543" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#0d9488" font-family="Consolas, 'Courier New', monospace">world rules</text>
    <text x="543" y="286" text-anchor="middle" font-size="11" fill="#64748b">校验合法性</text>
    <text x="543" y="302" text-anchor="middle" font-size="11" fill="#64748b">与前置条件</text>
  </g>

  <!-- Node 4: Settle -->
  <g filter="url(#shadow)">
    <rect x="652" y="130" width="170" height="174" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="737" cy="180" r="26" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <!-- scale icon -->
    <path d="M 727 188 h 20" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
    <path d="M 737 180 v 8" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
    <path d="M 729 182 v 4 M 745 182 v 4" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
    <path d="M 729 182 L 724 178 M 745 182 L 750 178" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
    <text x="737" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">结算</text>
    <text x="737" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#0d9488" font-family="Consolas, 'Courier New', monospace">receipt</text>
    <text x="737" y="286" text-anchor="middle" font-size="11" fill="#64748b">能量 · 资源</text>
    <text x="737" y="302" text-anchor="middle" font-size="11" fill="#64748b">· 关系</text>
  </g>

  <!-- Node 5: Commit -->
  <g filter="url(#shadow)">
    <rect x="846" y="130" width="170" height="174" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="931" cy="180" r="26" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <!-- database icon -->
    <ellipse cx="931" cy="175" rx="12" ry="5" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M 919 175 v 10 a 12 5 0 0 0 24 0 v -10" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M 919 180 a 12 5 0 0 0 24 0" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="931" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">写入</text>
    <text x="931" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb" font-family="Consolas, 'Courier New', monospace">S_t+1</text>
    <text x="931" y="286" text-anchor="middle" font-size="11" fill="#64748b">写入下一</text>
    <text x="931" y="302" text-anchor="middle" font-size="11" fill="#64748b">正式状态</text>
  </g>

  <!-- Node 6: Verify -->
  <g filter="url(#shadow)">
    <rect x="1040" y="130" width="170" height="174" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="1125" cy="180" r="26" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
    <!-- link icon -->
    <path d="M 1116 180 l 6 -6 a 5 5 0 0 1 7 0 l 4 4" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <path d="M 1134 180 l -6 6 a 5 5 0 0 1 -7 0 l -4 -4" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <text x="1125" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">校验</text>
    <text x="1125" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#059669" font-family="Consolas, 'Courier New', monospace">hash chain</text>
    <text x="1125" y="286" text-anchor="middle" font-size="11" fill="#64748b">哈希 · 不变量</text>
    <text x="1125" y="302" text-anchor="middle" font-size="11" fill="#64748b">· 留痕记录</text>
  </g>

  <!-- ===================== arrows ===================== -->
  <line x1="240" y1="209" x2="258" y2="209" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="434" y1="209" x2="452" y2="209" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="628" y1="209" x2="646" y2="209" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="822" y1="209" x2="840" y2="209" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1016" y1="209" x2="1034" y2="209" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===================== bottom callout ===================== -->
  <rect x="70" y="340" width="1140" height="104" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="640" y="374" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">LLM 只能产生候选动作，由确定性世界裁决一切后果</text>
  <text x="640" y="400" text-anchor="middle" font-size="13" fill="#475569">不存在的动作 → unrecognized_intent · 前置不满足 → illegal_action</text>
  <text x="640" y="422" text-anchor="middle" font-size="13" fill="#475569">每次转移都留下可校验的状态差分与哈希链</text>

  <!-- footer -->
  <text x="640" y="486" text-anchor="middle" font-size="13" fill="#94a3b8">WorldLoop — 环境权威的多智能体仿真与轨迹数据生成系统 · worldloop-kernel / scenarios / adapters / data</text>
</svg>
