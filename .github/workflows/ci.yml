name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install sibling packages + test deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Install in dependency order (matches the dependency graph of the
          # release layout). Editable installs let pytest pick up the tests
          # directory without extra PYTHONPATH tweaks.
          python -m pip install -e ./worldloop-kernel
          python -m pip install -e ./worldloop-scenarios
          python -m pip install -e ./worldloop-data
          python -m pip install -e ./worldloop-adapters
          python -m pip install "worldloop-adapters[dev]" "worldloop-data[dev]" pytest

      - name: pytest · worldloop-kernel
        run: pytest worldloop-kernel/tests -q

      - name: pytest · worldloop-scenarios
        run: pytest worldloop-scenarios/tests -q

      - name: pytest · worldloop-adapters
        run: pytest worldloop-adapters/tests -q

      - name: pytest · worldloop-data
        run: pytest worldloop-data/tests -q
