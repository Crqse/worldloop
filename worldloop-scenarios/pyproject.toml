[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldloop-scenarios"
version = "0.1.3"
description = "WorldLoop v2 Phase F (M3): ScenarioSpec v0 — schema-driven world definition for the worldloop-kernel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "冯福", email = "1148395497@qq.com" }]
keywords = ["world-model", "scenario", "spec", "schema", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "worldloop-kernel>=0.1.1",
    "pyyaml>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/Crqse/worldloop"
Documentation = "https://github.com/Crqse/worldloop#readme"
Issues = "https://github.com/Crqse/worldloop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worldloop_scenarios = ["schemas/*.json", "examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
